<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questly — turn your list into levels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161A21;
    --ink-soft:#1E232C;
    --paper:#F4F1E8;
    --paper-dim:#DAD5C6;
    --line: rgba(244,241,232,0.12);
    --amber:#E8A63D;
    --amber-dim: rgba(232,166,61,0.18);
    --teal:#4E9E8E;
    --coral:#E1604F;
    --text-hi: var(--paper);
    --text-lo: rgba(244,241,232,0.56);
    --radius: 3px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--ink);
    color: var(--text-hi);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3, .display, .stat-num{
    font-family:'Space Grotesk', sans-serif;
  }

  a{color:inherit;}

  button{
    font-family:'Inter', sans-serif;
    cursor:pointer;
  }

  :focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .app{
    display:grid;
    grid-template-columns: 300px 1fr;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background: var(--ink-soft);
    border-right: 1px solid var(--line);
    padding: 40px 32px;
    display:flex;
    flex-direction:column;
    gap:36px;
  }

  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand-mark{
    width:10px;height:10px;
    background: var(--amber);
    border-radius:2px;
    flex-shrink:0;
    transform: translateY(-2px);
  }
  .brand-name{
    font-size:20px;
    font-weight:600;
    letter-spacing:-0.01em;
  }

  .level-block{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .level-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
  }

  .level-label{
    font-size:13px;
    color: var(--text-lo);
    margin-bottom:4px;
  }

  .level-num{
    font-size:44px;
    font-weight:700;
    line-height:1;
    font-variant-numeric: tabular-nums;
  }

  .title-tag{
    font-size:13px;
    color: var(--amber);
    font-weight:500;
    text-align:right;
  }

  .xp-track{
    height:8px;
    background: rgba(244,241,232,0.08);
    border-radius:99px;
    overflow:hidden;
    position:relative;
  }
  .xp-fill{
    height:100%;
    background: var(--amber);
    border-radius:99px;
    width:0%;
    transition: width 700ms cubic-bezier(.2,.8,.2,1);
  }

  .xp-caption{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color: var(--text-lo);
    font-variant-numeric: tabular-nums;
  }

  .stat-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:1px;
    background: var(--line);
    border:1px solid var(--line);
    border-radius: var(--radius);
    overflow:hidden;
  }
  .stat-cell{
    background: var(--ink-soft);
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .stat-num{
    font-size:26px;
    font-weight:600;
    font-variant-numeric: tabular-nums;
    color: var(--text-hi);
  }
  .stat-num.streak{ color: var(--teal); }
  .stat-cap{
    font-size:11.5px;
    color: var(--text-lo);
  }

  .badges{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .badges-title{
    font-size:13px;
    color: var(--text-lo);
    margin-bottom:2px;
  }
  .badge-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .badge{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    padding: 8px 10px;
    border-radius: var(--radius);
    border:1px solid var(--line);
    color: var(--text-lo);
    transition: color 200ms, border-color 200ms, background 200ms;
  }
  .badge.unlocked{
    color: var(--text-hi);
    border-color: rgba(232,166,61,0.35);
    background: var(--amber-dim);
  }
  .badge-icon{
    width:16px;height:16px;
    flex-shrink:0;
  }
  .badge-name{ flex:1; }
  .badge-req{
    font-size:11px;
    color: inherit;
    opacity:0.7;
  }

  .reset-row{
    margin-top:auto;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  .reset-btn{
    background:none;
    border:none;
    color: var(--text-lo);
    font-size:12.5px;
    padding:0;
    text-decoration: underline;
    text-decoration-color: transparent;
    transition: color 150ms, text-decoration-color 150ms;
  }
  .reset-btn:hover{
    color: var(--coral);
    text-decoration-color: var(--coral);
  }

  /* ---------- Main ---------- */
  main{
    padding: 48px 56px 80px;
    max-width: 760px;
  }

  .main-head{
    margin-bottom:36px;
  }
  .main-head h1{
    font-size:28px;
    font-weight:600;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .main-head p{
    margin:0;
    color: var(--text-lo);
    font-size:14.5px;
    line-height:1.5;
    max-width:52ch;
  }

  .composer{
    display:flex;
    gap:10px;
    margin-bottom:40px;
  }
  .composer input[type="text"]{
    flex:1;
    background: var(--ink-soft);
    border:1px solid var(--line);
    color: var(--text-hi);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    border-radius: var(--radius);
  }
  .composer input[type="text"]::placeholder{ color: var(--text-lo); }
  .composer select{
    background: var(--ink-soft);
    border:1px solid var(--line);
    color: var(--text-hi);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:12px 10px;
    border-radius: var(--radius);
  }
  .composer button{
    background: var(--amber);
    color: var(--ink);
    border:none;
    font-weight:600;
    font-size:14px;
    padding:12px 20px;
    border-radius: var(--radius);
    transition: filter 150ms, transform 150ms;
  }
  .composer button:hover{ filter:brightness(1.08); }
  .composer button:active{ transform: translateY(1px); }

  .group{
    margin-bottom:34px;
  }
  .group-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .group-dot{
    width:7px;height:7px;
    border-radius:1px;
  }
  .group-title{
    font-size:13px;
    font-weight:600;
    color: var(--text-lo);
  }
  .group-count{
    font-size:12px;
    color: var(--text-lo);
    opacity:0.6;
  }

  .quest-list{
    display:flex;
    flex-direction:column;
  }
  .quest{
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 4px;
    border-bottom:1px solid var(--line);
  }
  .quest:last-child{ border-bottom:none; }

  .check{
    width:20px;height:20px;
    border-radius:50%;
    border:1.5px solid var(--paper-dim);
    background:transparent;
    flex-shrink:0;
    position:relative;
    transition: border-color 150ms, background 150ms;
  }
  .check:hover{ border-color: var(--amber); }
  .quest.done .check{
    background: var(--teal);
    border-color: var(--teal);
  }
  .check::after{
    content:"";
    position:absolute;
    left:5px; top:2px;
    width:5px; height:9px;
    border-right:2px solid var(--ink);
    border-bottom:2px solid var(--ink);
    transform: rotate(40deg);
    opacity:0;
  }
  .quest.done .check::after{ opacity:1; }

  .quest-name{
    flex:1;
    font-size:14.5px;
    color: var(--text-hi);
  }
  .quest.done .quest-name{
    color: var(--text-lo);
    text-decoration: line-through;
    text-decoration-color: rgba(244,241,232,0.3);
  }

  .quest-xp{
    font-size:12.5px;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
    flex-shrink:0;
  }
  .quest.done .quest-xp{ opacity:0.4; }

  .quest-del{
    background:none;
    border:none;
    color: var(--text-lo);
    font-size:16px;
    line-height:1;
    padding:2px 4px;
    opacity:0;
    transition: opacity 150ms, color 150ms;
  }
  .quest:hover .quest-del{ opacity:1; }
  .quest-del:hover{ color: var(--coral); }

  .empty{
    color: var(--text-lo);
    font-size:14px;
    padding: 18px 4px;
    border:1px dashed var(--line);
    border-radius: var(--radius);
    text-align:center;
  }

  .levelup-toast{
    position:fixed;
    top:28px;
    left:50%;
    transform: translateX(-50%) translateY(-12px);
    background: var(--amber);
    color: var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:12px 20px;
    border-radius: var(--radius);
    opacity:0;
    pointer-events:none;
    transition: opacity 220ms, transform 220ms;
    z-index:10;
  }
  .levelup-toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 760px){
    .app{ grid-template-columns: 1fr; }
    .sidebar{
      border-right:none;
      border-bottom:1px solid var(--line);
      padding:28px 24px;
    }
    main{ padding: 32px 24px 60px; }
    .reset-row{ margin-top:8px; }
  }

  @media (prefers-reduced-motion: reduce){
    .xp-fill, .levelup-toast{ transition:none; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">Questly</span>
    </div>

    <div class="level-block">
      <div class="level-row">
        <div>
          <div class="level-label">Level</div>
          <div class="level-num" id="levelNum">1</div>
        </div>
        <div class="title-tag" id="titleTag">Novice</div>
      </div>
      <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
      <div class="xp-caption">
        <span id="xpNow">0 XP</span>
        <span id="xpNeed">100 XP to next level</span>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-cell">
        <div class="stat-num" id="doneToday">0</div>
        <div class="stat-cap">done today</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num streak" id="streakNum">0</div>
        <div class="stat-cap">day streak</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num" id="totalDone">0</div>
        <div class="stat-cap">quests cleared</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num" id="totalXp">0</div>
        <div class="stat-cap">lifetime XP</div>
      </div>
    </div>

    <div class="badges">
      <div class="badges-title">Badges</div>
      <div class="badge-list" id="badgeList"></div>
    </div>

    <div class="reset-row">
      <button class="reset-btn" id="resetBtn">Reset all progress</button>
    </div>
  </aside>

  <main>
    <div class="main-head">
      <h1>Today's quests</h1>
      <p>Add anything you need to get done. Clearing a quest earns XP toward your next level — bigger quests are worth more.</p>
    </div>

    <form class="composer" id="composer">
      <input type="text" id="questInput" placeholder="Add a quest, e.g. &quot;Reply to emails&quot;" maxlength="80" required>
      <select id="questDiff" title="Difficulty">
        <option value="10">Easy · 10 XP</option>
        <option value="25" selected>Medium · 25 XP</option>
        <option value="50">Hard · 50 XP</option>
      </select>
      <button type="submit">Add</button>
    </form>

    <div id="board"></div>
  </main>

</div>

<div class="levelup-toast" id="levelToast">Level up!</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

// ponytail: web API keys are public by design; Firestore rules are the real guard.
const app = initializeApp({
  apiKey: "AIzaSyACp5uAVW7qgz37fC4KBK3W9ujRJkygdg0",
  authDomain: "questly-7f3a2.firebaseapp.com",
  projectId: "questly-7f3a2",
  storageBucket: "questly-7f3a2.firebasestorage.app",
  messagingSenderId: "76941771778",
  appId: "1:76941771778:web:f6b8ce393cab367711d31b"
});
const db = getFirestore(app);

(async function(){
  // ponytail: anonymous auth now; Google sign-in later is linkWithPopup on this same uid.
  const { user } = await signInAnonymously(getAuth(app));
  const ref = doc(db, 'users', user.uid);

  function today(){ return new Date().toISOString().slice(0, 10); }

  let state = {
    xp: 0,
    totalXp: 0,
    totalDone: 0,
    doneToday: 0,
    streak: 0,
    day: today(),
    quests: [
      { id: cryptoId(), name: "Add your first real quest", xp: 10, done: false },
      { id: cryptoId(), name: "Check one off to earn XP", xp: 25, done: false },
    ]
  };

  const snap = await getDoc(ref);
  if (snap.exists()) state = Object.assign(state, snap.data());

  // doneToday/streak only mean anything once state persists across days.
  function rollDay(){
    const t = today();
    if (state.day === t) return;
    const yesterday = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    if (state.day !== yesterday || state.doneToday === 0) state.streak = 0;
    state.doneToday = 0;
    state.day = t;
  }
  rollDay();

  function cryptoId(){
    return 'q_' + Math.random().toString(36).slice(2, 10);
  }

  const titles = [
    { min: 1, name: "Novice" },
    { min: 3, name: "Apprentice" },
    { min: 5, name: "Adept" },
    { min: 8, name: "Specialist" },
    { min: 12, name: "Veteran" },
    { min: 16, name: "Expert" },
    { min: 20, name: "Master" },
  ];

  const badgeDefs = [
    { id:'first',  name:'First Blood',    req:'Clear 1 quest',      icon:diamond, test: s => s.totalDone >= 1 },
    { id:'ten',    name:'Momentum',       req:'Clear 10 quests',    icon:diamond, test: s => s.totalDone >= 10 },
    { id:'fifty',  name:'Grinder',        req:'Clear 50 quests',    icon:diamond, test: s => s.totalDone >= 50 },
    { id:'streak3',name:'On a Roll',      req:'3-day streak',       icon:flame,   test: s => s.streak >= 3 },
    { id:'streak7',name:'Unstoppable',    req:'7-day streak',       icon:flame,   test: s => s.streak >= 7 },
    { id:'lvl5',   name:'Rising Star',    req:'Reach level 5',      icon:star,    test: s => levelFromXp(s.totalXp).level >= 5 },
    { id:'lvl10',  name:'Legend',         req:'Reach level 10',     icon:star,    test: s => levelFromXp(s.totalXp).level >= 10 },
  ];

  function diamond(cls){ return `<svg class="${cls}" viewBox="0 0 16 16" fill="none"><path d="M8 1L14 6L8 15L2 6L8 1Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>`; }
  function flame(cls){ return `<svg class="${cls}" viewBox="0 0 16 16" fill="none"><path d="M8 1C8 4 5 5 5 8.5C5 11 6.5 13 8 13C9.5 13 11 11.5 11 9.5C11 8 10 7.5 10 6C10.5 7 11.5 7.5 11.5 9.5C11.5 12.5 9.8 15 8 15C5.5 15 3.5 12.5 3.5 9.5C3.5 5.5 8 5 8 1Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>`; }
  function star(cls){ return `<svg class="${cls}" viewBox="0 0 16 16" fill="none"><path d="M8 1.5L9.8 5.9L14.5 6.3L10.9 9.3L12 14L8 11.3L4 14L5.1 9.3L1.5 6.3L6.2 5.9L8 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>`; }

  const XP_PER_LEVEL = 100;
  const GROWTH = 1.18; // each level needs a bit more XP than the last

  function levelFromXp(totalXp){
    let level = 1, floor = 0, need = XP_PER_LEVEL;
    while (totalXp >= floor + need) {
      floor += need;
      level += 1;
      need = Math.round(need * GROWTH);
    }
    return { level, floor, need, into: totalXp - floor };
  }

  function titleFor(level){
    let current = titles[0].name;
    for (const t of titles) if (level >= t.min) current = t.name;
    return current;
  }

  // ---------- DOM refs ----------
  const board = document.getElementById('board');
  const composer = document.getElementById('composer');
  const questInput = document.getElementById('questInput');
  const questDiff = document.getElementById('questDiff');
  const resetBtn = document.getElementById('resetBtn');
  const toast = document.getElementById('levelToast');

  let lastLevel = 1;

  function render(){
    rollDay();
    setDoc(ref, state).catch(e => console.error('save failed', e));
    const lvl = levelFromXp(state.totalXp);

    document.getElementById('levelNum').textContent = lvl.level;
    document.getElementById('titleTag').textContent = titleFor(lvl.level);
    document.getElementById('xpFill').style.width = Math.min(100, (lvl.into / lvl.need) * 100) + '%';
    document.getElementById('xpNow').textContent = lvl.into + ' XP';
    document.getElementById('xpNeed').textContent = (lvl.need - lvl.into) + ' XP to next level';

    document.getElementById('doneToday').textContent = state.doneToday;
    document.getElementById('streakNum').textContent = state.streak;
    document.getElementById('totalDone').textContent = state.totalDone;
    document.getElementById('totalXp').textContent = state.totalXp;

    // badges
    const badgeList = document.getElementById('badgeList');
    badgeList.innerHTML = badgeDefs.map(b => {
      const unlocked = b.test(state);
      return `<div class="badge ${unlocked ? 'unlocked' : ''}">
        ${b.icon('badge-icon')}
        <span class="badge-name">${b.name}</span>
        <span class="badge-req">${b.req}</span>
      </div>`;
    }).join('');

    // quest board, grouped by status
    const active = state.quests.filter(q => !q.done);
    const done = state.quests.filter(q => q.done);

    let html = '';
    html += renderGroup('Open', active, 'var(--amber)');
    if (done.length) html += renderGroup('Cleared', done, 'var(--teal)');
    if (!state.quests.length) html += `<div class="empty">No quests yet. Add one above to start earning XP.</div>`;
    board.innerHTML = html;

    board.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', () => toggleQuest(el.getAttribute('data-toggle')));
    });
    board.querySelectorAll('[data-del]').forEach(el => {
      el.addEventListener('click', (e) => { e.stopPropagation(); deleteQuest(el.getAttribute('data-del')); });
    });

    // level-up toast
    if (lvl.level > lastLevel) {
      toast.textContent = `Level up — you're now level ${lvl.level}`;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }
    lastLevel = lvl.level;
  }

  function renderGroup(title, quests, dotColor){
    if (!quests.length) return '';
    return `
      <div class="group">
        <div class="group-head">
          <span class="group-dot" style="background:${dotColor}"></span>
          <span class="group-title">${title}</span>
          <span class="group-count">${quests.length}</span>
        </div>
        <div class="quest-list">
          ${quests.map(q => `
            <div class="quest ${q.done ? 'done' : ''}">
              <button class="check" data-toggle="${q.id}" aria-label="Toggle ${escapeHtml(q.name)}"></button>
              <span class="quest-name" data-toggle="${q.id}">${escapeHtml(q.name)}</span>
              <span class="quest-xp">+${q.xp} XP</span>
              <button class="quest-del" data-del="${q.id}" aria-label="Delete ${escapeHtml(q.name)}">&times;</button>
            </div>
          `).join('')}
        </div>
      </div>`;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function toggleQuest(id){
    const q = state.quests.find(q => q.id === id);
    if (!q) return;
    q.done = !q.done;
    if (q.done) {
      state.xp += q.xp;
      state.totalXp += q.xp;
      state.totalDone += 1;
      state.doneToday += 1;
      if (state.doneToday === 1) state.streak += 1;
    } else {
      state.totalXp = Math.max(0, state.totalXp - q.xp);
      state.totalDone = Math.max(0, state.totalDone - 1);
      state.doneToday = Math.max(0, state.doneToday - 1);
    }
    render();
  }

  function deleteQuest(id){
    state.quests = state.quests.filter(q => q.id !== id);
    render();
  }

  composer.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = questInput.value.trim();
    if (!name) return;
    state.quests.unshift({ id: cryptoId(), name, xp: Number(questDiff.value), done: false });
    questInput.value = '';
    questInput.focus();
    render();
  });

  resetBtn.addEventListener('click', () => {
    if (!confirm('Reset all progress? This clears your level, XP, streak, and quests.')) return;
    state = { xp:0, totalXp:0, totalDone:0, doneToday:0, streak:0, day: today(), quests: [] };
    lastLevel = 1;
    render();
  });

  render();
})();
</script>

</body>
</html>
