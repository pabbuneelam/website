[project]
name = "slate"
version = "0.1.0"
description = "Nightly NBA fantasy scored on percentile-of-residual"
requires-python = ">=3.11"
# google-cloud-firestore is a runtime dependency, not an extra: on Vercel the
# in-memory store is not merely non-durable, it is wrong -- instances are
# stateless and scale to zero, so a submit and its resolve can land on
# different ones.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "google-cloud-firestore>=2.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Offline ingestion only -- never imported by the API.
ingest = ["nba_api>=1.4"]
# AI review step for tests/e2e/review.py -- never imported by the API or by
# pytest. Playwright itself lives in tests/e2e/package.json (Node), not here.
e2e = ["anthropic>=0.40"]

[tool.vercel]
# Vercel loads `app` from slate/api.py. Without this it would look for
# app.py / main.py / server.py at the project root.
entrypoint = "slate.api:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slate*"]

[tool.setuptools.package-data]
slate = ["fixtures/*.json"]
