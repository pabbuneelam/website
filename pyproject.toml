[project]
name = "slate"
version = "0.1.0"
description = "Nightly NBA fantasy scored on percentile-of-residual"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Only needed to run against Firebase; the default in-memory store needs nothing.
firestore = ["google-cloud-firestore>=2.19"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slate*"]

[tool.setuptools.package-data]
slate = ["fixtures/*.json"]
